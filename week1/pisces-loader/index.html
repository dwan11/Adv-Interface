<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pisces Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@400;500&family=Poiret+One&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<main class="wrap">

  <section class="stage" aria-label="Loader preview">
    <div class="sky" id="sky"></div>
  </section>

  <section class="readout" id="readout" data-state="empty" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Constellation progress">
    <div class="pct"><span id="pct">0</span><small>%</small></div>
    <div class="now" id="now">16 stars waiting</div>
    <div class="state"><i></i><span id="stateLabel">Unlinked</span></div>
    <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div></div>
  </section>

  <section class="controls">
    <div class="group">
      <div class="mode" role="radiogroup" aria-label="Indicator type">
        <button id="mIndet" role="radio" aria-checked="false"><strong>Indeterminate</strong><span>Progress unknown · comet loops</span></button>
        <button id="mDet" role="radio" aria-checked="true"><strong>Determinate</strong><span>0–100% · links fill</span></button>
      </div>
      <div class="row">
        <label for="scrub">Progress</label>
        <input type="range" id="scrub" min="0" max="100" step="1" value="0">
      </div>
    </div>
  </section>
</main>
<script src="pisces-loader.js"></script><script src="app.js"></script></body></html>
