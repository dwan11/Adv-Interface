<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glitter Diary Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Titan+One&family=Nunito:wght@600;800&family=Pacifico&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<main class="wrap">

  <section class="stage" id="diary" aria-label="Diary loader"></section>

  <section class="readout" id="readout" data-state="empty" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress">
    <div class="status" id="status">LOADING</div>
    <div class="meta"><span class="pct" id="pct">0%</span><span class="hearts" id="hearts" aria-hidden="true"></span></div>
  </section>

  <section class="controls">
    <div class="group">
      <div class="mode" role="radiogroup" aria-label="Indicator type">
        <button id="mIndet" role="radio" aria-checked="false"><strong>Indeterminate</strong><span>Progress unknown · keeps flipping</span></button>
        <button id="mDet" role="radio" aria-checked="true"><strong>Determinate</strong><span>0–100% · fills the hearts</span></button>
      </div>
      <div class="row"><label for="scrub">Progress</label><input type="range" id="scrub" min="0" max="100" step="1" value="0"></div>
    </div>
  </section>
</main>
<script src="diary-loader.js"></script><script src="app.js"></script></body></html>
