<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diamond Bee Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Hanken+Grotesk:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<main class="wrap">

  <section class="stage" id="stage" aria-label="3D bee brooch. Drag to turn it in the light.">
    <div class="fallback" id="fallback" hidden>This preview needs WebGL, which isn't available in this browser.</div>
    <span class="hint">Drag to turn</span>
  </section>

  <section class="readout" id="readout" data-state="empty" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress">
    <div class="pct"><span id="pct">0</span><small>%</small></div>
    <div class="status"><span class="state" id="stateLabel">At rest</span><span class="note" id="note">Wings folded, on its cushion</span></div>
    <div class="comb" id="comb" aria-hidden="true"></div>
  </section>

  <section class="controls">
    <div class="group">
      <div class="mode" role="radiogroup" aria-label="Indicator type">
        <button id="mIndet" role="radio" aria-checked="false"><strong>Indeterminate</strong><span>Progress unknown · waggle dance</span></button>
        <button id="mDet" role="radio" aria-checked="true"><strong>Determinate</strong><span>0–100% · flight</span></button>
      </div>
      <div class="row"><label for="scrub">Progress</label><input type="range" id="scrub" min="0" max="100" step="1" value="0"></div>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="three.min.js"><\/script>')</script><script src="bee-loader.js"></script><script src="app.js"></script></body></html>
