<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Coupe Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=JetBrains+Mono:wght@300;400&family=Manrope:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<main class="wrap">
  <section class="stage" id="stage" data-state="empty" aria-label="Loader preview">
    <div class="glass" id="glass" data-state="empty">
      <div class="halo"></div>
      <canvas id="cup" width="544" height="720" role="img" aria-label="Coupe glass filling as progress rises"></canvas>
      <div class="boot" id="boot">pouring frames… 0%</div>
    </div>
    <div class="readout" role="progressbar" id="pbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="pct"><span id="pct">0</span><small>%</small></div>
      <div class="state"><i></i><span id="stateLabel">Empty</span></div>
    </div>
    <div class="bar"><b id="fill"></b></div>
    <div class="ticks" aria-hidden="true"><span style="left:0">0</span><span style="left:25%">¼</span><span style="right:0">full</span></div>
  </section>

  <section class="panel">

    <div class="mode" role="radiogroup" aria-label="Indicator type">
      <button id="mIndet" role="radio" aria-checked="false"><strong>Indeterminate</strong><span>Progress unknown · loops</span></button>
      <button id="mDet" role="radio" aria-checked="true"><strong>Determinate</strong><span>0–100% · fills</span></button>
    </div>

    <div class="row">
      <label for="scrub">Progress</label>
      <input type="range" id="scrub" min="0" max="100" step="1" value="0">
    </div>
  </section>
</main>
<script src="loader.js"></script><script src="app.js"></script></body></html>
