<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sliding pearl · Adv Interface</title><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:light-dark(#faf0f5,#211a23)}body>main{width:min(736px,100%)}.cursor-interaction,input,button,label{cursor:pointer}button:focus-visible{outline:2px solid light-dark(#487aa1,#bddfff);outline-offset:5px}</style><script>(()=>{const key='adv-interface-salon-radio';let state=null;try{state=JSON.parse(localStorage.getItem(key))}catch{}window.openai={widgetState:state,setWidgetState(next){this.widgetState=next;try{localStorage.setItem(key,JSON.stringify(next))}catch{}return Promise.resolve()}}})();</script></head><body><main><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<div id="salon-radio" class="viz-dotted-background" aria-label="Sliding pearl radio buttons">
<section aria-label="Sliding pearl radio buttons"><div class="stage"><fieldset class="paper pearl"><legend>Finishing touch</legend><div class="choices"><span class="traveler" aria-hidden="true"></span></div><span class="stitch top" aria-hidden="true"></span><span class="stitch bottom" aria-hidden="true"></span></fieldset></div></section>
</div>
<style>
#salon-radio{--paper:light-dark(#fff7fa,#30232d);--ink:light-dark(#79516a,#efd6e4);--rose:light-dark(#bf87a3,#ba849f);--pink:light-dark(#f4c7df,#654559);--blue:light-dark(#b9d9f4,#3e627f);--blue-ink:light-dark(#487aa1,#bddfff);--shine:light-dark(#fffef8,#9cc4df);--line:light-dark(#ebcedd,#563a4d);font-family:'VT323',monospace;color:var(--ink)}
#salon-radio *{box-sizing:border-box}#salon-radio .stage{min-height:410px;display:grid;place-items:center;padding:60px 24px 52px}
#salon-radio .paper{position:relative;isolation:isolate;width:min(100%,320px);margin:0;border:0;padding:36px 22px 34px;background:var(--paper);transform:rotate(-4deg);border-radius:18px;box-shadow:0 9px 0 light-dark(#d6b4c522,#100a142f),inset 0 -5px 8px light-dark(#ddacc422,#130c162f);background-image:radial-gradient(var(--line) .65px,transparent .7px);background-size:5px 5px}
#salon-radio .paper:before{content:'';position:absolute;inset:-2px;z-index:-1;border:2px solid var(--rose);border-radius:18px;clip-path:polygon(0 0,86% 0,86% 1%,93% 1%,93% 0,100% 0,100% 36%,99% 36%,99% 43%,100% 43%,100% 100%,20% 100%,20% 99%,13% 99%,13% 100%,0 100%,0 67%,1% 67%,1% 60%,0 60%)}
#salon-radio legend{float:left;width:100%;padding:0 0 20px;font-size:29px;line-height:1;color:var(--ink)}#salon-radio .choices{clear:both;position:relative;display:grid;gap:7px}
#salon-radio label{position:relative;display:flex;align-items:center;gap:13px;min-height:52px;padding:8px 7px;border-radius:12px;font-size:25px;line-height:1.1;transition:color .35s,background .35s,transform .3s}
#salon-radio input{position:absolute;width:32px;height:32px;left:7px;margin:0;opacity:0;z-index:5}#salon-radio label:has(input:focus-visible){outline:2px solid var(--blue-ink);outline-offset:3px}
#salon-radio .ring{width:28px;height:28px;flex-shrink:0;position:relative;background:var(--rose);clip-path:polygon(28% 0,72% 0,72% 7%,86% 7%,86% 14%,93% 14%,93% 28%,100% 28%,100% 72%,93% 72%,93% 86%,86% 86%,86% 93%,72% 93%,72% 100%,28% 100%,28% 93%,14% 93%,14% 86%,7% 86%,7% 72%,0 72%,0 28%,7% 28%,7% 14%,14% 14%,14% 7%,28% 7%);transition:background .35s,transform .45s}
#salon-radio .ring:before{content:'';position:absolute;inset:2px;background:var(--paper);border-radius:50%;box-shadow:inset 0 2px 2px light-dark(#bf87a333,#0003)}
#salon-radio .ring:after{content:'';position:absolute;inset:7px;border-radius:40%;background:var(--blue);transform:scale(0);transition:transform .48s cubic-bezier(.2,.8,.25,1.4);box-shadow:inset 2px 2px 0 var(--shine)}
#salon-radio label:has(:checked){color:var(--blue-ink)}#salon-radio :checked~.ring{background:var(--blue-ink)}#salon-radio :checked~.ring:after{transform:scale(1)}
#salon-radio .stitch{position:absolute;height:3px;left:28px;right:32px;background:repeating-linear-gradient(90deg,var(--rose) 0 7px,transparent 7px 19px);opacity:.45}.top{top:12px}.bottom{bottom:12px}
#salon-radio .orbit label:has(:checked){background:light-dark(#c7def333,#456e892c)}#salon-radio .orbit label[data-burst] .ring{animation:orbit-pop .65s ease-out}#salon-radio .orbit label[data-burst]:after{content:'';position:absolute;left:16px;top:4px;width:3px;height:3px;background:var(--blue);box-shadow:20px 9px 0 var(--rose),-8px 22px 0 var(--blue),17px 37px 0 var(--rose);animation:orbit-sparks .65s ease-out both;pointer-events:none}
#salon-radio .pearl .choices:before{content:'';position:absolute;left:19px;top:22px;bottom:22px;width:4px;background:var(--line);box-shadow:inset 1px 0 0 light-dark(#bd91a755,#170d2155)}
#salon-radio .pearl .ring{width:24px;height:24px;margin-left:2px;margin-right:2px;background:var(--rose);opacity:.5}#salon-radio .pearl .ring:after{display:none}#salon-radio .pearl :checked~.ring{opacity:0}
#salon-radio .traveler{position:absolute;left:7px;top:12px;width:28px;height:28px;z-index:2;background:var(--blue);border:2px solid var(--blue-ink);border-radius:42%;box-shadow:inset 3px 3px 0 var(--shine);transition:transform .7s cubic-bezier(.22,.8,.24,1);pointer-events:none}#salon-radio .traveler:after{content:'';position:absolute;inset:8px;background:var(--blue-ink);border-radius:50%;opacity:.4}
#salon-radio .bloom label{border-bottom:1px dashed var(--line);border-radius:0;padding-bottom:12px;min-height:58px}#salon-radio .bloom label:last-child{border:0}#salon-radio .bloom .ring:after{inset:3px;clip-path:polygon(33% 0,67% 0,67% 17%,83% 17%,83% 33%,100% 33%,100% 67%,83% 67%,83% 83%,67% 83%,67% 100%,33% 100%,33% 83%,17% 83%,17% 67%,0 67%,0 33%,17% 33%,17% 17%,33% 17%);border-radius:0;box-shadow:none;transition:transform .65s cubic-bezier(.18,.7,.25,1.25)}#salon-radio .bloom :checked~.ring:after{transform:scale(1) rotate(90deg)}#salon-radio .bloom label:after{content:'✦';position:absolute;right:8px;font-size:22px;color:var(--blue-ink);opacity:0;transform:scale(.3) rotate(-45deg);transition:opacity .4s,transform .6s}#salon-radio .bloom label:has(:checked):after{opacity:1;transform:scale(1) rotate(0)}
@media(hover:hover){#salon-radio label:hover{transform:translate(2px,-1px);background:light-dark(#f4c7df33,#65455944)}}
@keyframes orbit-pop{0%,100%{transform:scale(1)}35%{transform:scale(.88) translateY(2px)}65%{transform:scale(1.12) translateY(-2px)}}@keyframes orbit-sparks{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){#salon-radio *{animation:none!important;transition:none!important}}

#salon-radio .pearl{--pixel-round:polygon(28.57% 0,71.43% 0,71.43% 7.14%,85.71% 7.14%,85.71% 14.29%,92.86% 14.29%,92.86% 28.57%,100% 28.57%,100% 71.43%,92.86% 71.43%,92.86% 85.71%,85.71% 85.71%,85.71% 92.86%,71.43% 92.86%,71.43% 100%,28.57% 100%,28.57% 92.86%,14.29% 92.86%,14.29% 85.71%,7.14% 85.71%,7.14% 71.43%,0 71.43%,0 28.57%,7.14% 28.57%,7.14% 14.29%,14.29% 14.29%,14.29% 7.14%,28.57% 7.14%)}
#salon-radio .pearl .choices:before{left:19px;width:4px;background:repeating-linear-gradient(to bottom,var(--rose) 0 3px,transparent 3px 9px);box-shadow:none;opacity:.6}
#salon-radio .pearl .ring{width:28px;height:28px;margin:0;clip-path:var(--pixel-round);opacity:.7}
#salon-radio .pearl .ring:before{border-radius:0;clip-path:var(--pixel-round);box-shadow:none}
#salon-radio .traveler{border:0;border-radius:0;background:var(--blue-ink);clip-path:var(--pixel-round);box-shadow:none}
#salon-radio .traveler:before{content:'';position:absolute;inset:2px;background:var(--blue);clip-path:var(--pixel-round)}
#salon-radio .traveler:after{inset:auto;left:6px;top:6px;width:6px;height:2px;border-radius:0;background:var(--shine);opacity:1;box-shadow:-2px 2px 0 var(--shine)}

#salon-radio .pearl .ring{opacity:1;background:var(--rose);transition:background .45s}
#salon-radio .pearl .ring:before{background:var(--pink);transition:background .45s}
#salon-radio .pearl :checked~.ring{opacity:1;background:var(--blue-ink)}
#salon-radio .pearl :checked~.ring:before{background:var(--blue)}

#salon-radio .pearl .ring,#salon-radio .pearl :checked~.ring{opacity:.7;background:var(--rose)}
#salon-radio .pearl .ring:before,#salon-radio .pearl :checked~.ring:before{background:var(--paper)}
#salon-radio .pearl{--ball-fill:var(--blue);--ball-edge:var(--blue-ink)}
#salon-radio .pearl[data-choice="1"]{--ball-fill:light-dark(#efb6d1,#a4597e);--ball-edge:light-dark(#ae5c83,#edb1cd)}
#salon-radio .pearl[data-choice="2"]{--ball-fill:light-dark(#cfbde9,#796397);--ball-edge:light-dark(#8d6ba8,#dcc5f1)}
#salon-radio .traveler{background:var(--ball-edge);transition:transform .7s cubic-bezier(.22,.8,.24,1),background-color .7s cubic-bezier(.22,.8,.24,1)}
#salon-radio .traveler:before{background:var(--ball-fill);transition:background-color .7s cubic-bezier(.22,.8,.24,1)}
@media(prefers-reduced-motion:reduce){#salon-radio .traveler,#salon-radio .traveler:before{transition:none}}

#salon-radio .pearl label:has(:checked){color:var(--ball-edge);transition:color .7s cubic-bezier(.22,.8,.24,1),background .35s,transform .3s}
#salon-radio .paper{--edge-cut:polygon(14px 0,73% 0,73% 3px,79% 3px,79% 0,calc(100% - 18px) 0,calc(100% - 18px) 4px,calc(100% - 8px) 4px,calc(100% - 8px) 10px,calc(100% - 3px) 10px,calc(100% - 3px) 17px,100% 17px,100% 39%,calc(100% - 3px) 39%,calc(100% - 3px) 45%,100% 45%,100% calc(100% - 12px),calc(100% - 5px) calc(100% - 12px),calc(100% - 5px) calc(100% - 5px),calc(100% - 13px) calc(100% - 5px),calc(100% - 13px) 100%,31% 100%,31% calc(100% - 3px),24% calc(100% - 3px),24% 100%,19px 100%,19px calc(100% - 4px),9px calc(100% - 4px),9px calc(100% - 10px),3px calc(100% - 10px),3px calc(100% - 20px),0 calc(100% - 20px),0 66%,3px 66%,3px 58%,0 58%,0 15px,4px 15px,4px 7px,14px 7px);border-radius:0;background:none;box-shadow:none}
#salon-radio .paper:before{inset:-2px;border:0;border-radius:0;clip-path:var(--edge-cut);background:var(--rose);z-index:-2}
#salon-radio .paper:after{content:'';position:absolute;inset:1px;clip-path:var(--edge-cut);background-color:var(--paper);background-image:radial-gradient(var(--line) .65px,transparent .7px);background-size:5px 5px;box-shadow:inset 0 -4px 7px light-dark(#ddacc422,#130c162f);z-index:-1;pointer-events:none}

#salon-radio .pearl .choices:before{display:none}
#salon-radio .path-dot{position:absolute;left:19px;width:4px;height:3px;background:var(--rose);opacity:.45;pointer-events:none;transition:opacity .18s,background-color .18s,scale .18s}
#salon-radio .path-dot[data-near]{background:var(--ball-edge);opacity:1;scale:1.25}
#salon-radio label>span:last-child{transition:translate .45s}
#salon-radio label:has(:checked)>span:last-child{translate:2px 0}
@media(hover:hover){#salon-radio .pearl label:hover{transform:none}#salon-radio .pearl label:not(:has(:checked)):hover .ring{transform:translateY(-2px) rotate(-5deg)}}
#salon-radio .traveler[data-land]{animation:pearl-land .34s ease-out}
@keyframes pearl-land{0%,100%{scale:1}30%{scale:1.08 .9}65%{scale:.97 1.04}}
#salon-radio .edge-chip{position:absolute;width:7px;height:3px;background:var(--rose);opacity:.55;pointer-events:none}
#salon-radio .edge-chip:nth-of-type(1){left:35px;top:2px}#salon-radio .edge-chip:nth-of-type(2){right:2px;top:78px;width:3px;height:8px}#salon-radio .edge-chip:nth-of-type(3){left:52px;bottom:1px;width:12px;height:2px}
@media(prefers-reduced-motion:reduce){#salon-radio .traveler[data-land]{animation:none}#salon-radio .path-dot,#salon-radio label>span:last-child{transition:none}}
</style>
<script>
(()=>{const root=document.getElementById('salon-radio');const names=['Sleek & smooth','Soft waves','Natural texture'];const keys=['pearl'];let saved={};function apply(state){saved=state?.modelContent?.salonRadio||{};keys.forEach(key=>{const card=root.querySelector('.'+key);const chosen=names.includes(saved[key])?saved[key]:names[0];card.querySelectorAll('input').forEach(i=>i.checked=i.value===chosen);move(card);});}function move(card){const inputs=[...card.querySelectorAll('input')];const idx=inputs.findIndex(i=>i.checked);const previous=card.dataset.choice;card.dataset.choice=String(idx);const pearl=card.querySelector('.traveler');if(!pearl)return;const label=inputs[idx].closest('label');const choices=card.querySelector('.choices');choices.querySelectorAll('.path-dot').forEach(d=>d.remove());const dots=[];for(let y=25;y<choices.offsetHeight-22;y+=9){const d=document.createElement('i');d.className='path-dot';d.setAttribute('aria-hidden','true');d.style.top=y+'px';choices.prepend(d);dots.push(d)}delete pearl.dataset.land;if(card._pathFrame)cancelAnimationFrame(card._pathFrame);clearTimeout(card._landTimer);pearl.style.transform=`translateY(${label.offsetTop}px) rotate(${idx*90}deg)`;if(previous===undefined||previous===String(idx)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const start=performance.now();function light(now){const matrix=new DOMMatrixReadOnly(getComputedStyle(pearl).transform);const center=matrix.m42+26;dots.forEach(d=>{if(Math.abs(parseFloat(d.style.top)-center)<17)d.dataset.near='true';else delete d.dataset.near});if(now-start<720)card._pathFrame=requestAnimationFrame(light);else{dots.forEach(d=>delete d.dataset.near);pearl.dataset.land='true';card._landTimer=setTimeout(()=>delete pearl.dataset.land,360)}}card._pathFrame=requestAnimationFrame(light);}

keys.forEach(key=>{const card=root.querySelector('.'+key);const choices=card.querySelector('.choices');for(let c=0;c<3;c++){const chip=document.createElement('i');chip.className='edge-chip';chip.setAttribute('aria-hidden','true');card.append(chip);}names.forEach((name,index)=>{const label=document.createElement('label');label.className='cursor-interaction';const input=document.createElement('input');input.type='radio';input.name='salon-'+key;input.value=name;input.checked=index===0;const ring=document.createElement('span');ring.className='ring';ring.setAttribute('aria-hidden','true');const text=document.createElement('span');text.textContent=name;label.append(input,ring,text);choices.append(label);input.addEventListener('change',()=>{saved[key]=name;card.querySelectorAll('label').forEach(l=>delete l.dataset.burst);label.dataset.burst='true';setTimeout(()=>delete label.dataset.burst,700);move(card);window.openai?.setWidgetState({modelContent:{salonRadio:saved},privateContent:null}).catch(()=>{});});});if(globalThis.Tweak){const params={spacing:7};const tweak=new Tweak({container:card,onChange:()=>{choices.style.gap=params.spacing+'px';move(card);}});tweak.addSlider(params,'spacing',{label:'Row spacing',min:4,max:16,step:1,unit:'px'});}});apply(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)apply(e.detail.globals.widgetState)});})();
</script>
</main></body></html>
