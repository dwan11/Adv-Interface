<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adv Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1d1b18; --muted: #6b655c;
    --line: #e4ded4; --accent: #9a6b2f; --preview: #efe9df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --card: #1f1d1a; --ink: #f1ece4; --muted: #a39b8f;
      --line: #2f2c27; --accent: #d7a560; --preview: #26231f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 Inter, system-ui, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 20px 80px; }
  header h1 {
    font: 600 clamp(2.2rem, 5vw, 3.4rem)/1.05 Fraunces, Georgia, serif;
    margin: 0 0 10px; letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .tabs {
    display: flex; gap: 4px; margin-top: 40px; border-bottom: 1px solid var(--line);
  }
  .tabs button {
    appearance: none; background: none; border: 0; cursor: pointer;
    padding: 10px 16px; margin-bottom: -1px; color: var(--muted);
    font: 500 .95rem Inter, sans-serif; border-bottom: 2px solid transparent;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px 6px 0 0; }
  h2 {
    font: 600 1.4rem/1.2 Fraunces, Georgia, serif;
    margin: 32px 0 6px; display: flex; align-items: baseline; gap: 12px;
  }
  h2 span { font: 500 .8rem Inter, sans-serif; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .grid {
    display: grid; gap: 20px; margin-top: 20px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    color: inherit; text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px); border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(0,0,0,.08); outline: none;
  }
  .preview {
    position: relative; aspect-ratio: 4 / 3; background: var(--preview);
    overflow: hidden; border-bottom: 1px solid var(--line);
  }
  .preview iframe {
    position: absolute; top: 0; left: 0; border: 0;
    width: 250%; height: 250%; transform: scale(.4); transform-origin: 0 0;
    pointer-events: none;
  }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .body h3 { margin: 0; font: 600 1.15rem/1.25 Fraunces, Georgia, serif; }
  .body p { margin: 0; color: var(--muted); font-size: .92rem; }
  .links { margin-top: auto; padding-top: 10px; display: flex; gap: 16px; font-size: .85rem; font-weight: 500; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Adv Interface</h1>
    <p>Coursework for Advanced Interface. Click a card to open the live demo.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Weeks">
    <button role="tab" id="tab-week1" aria-controls="week1-panel" aria-selected="true">Week 1</button>
    <button role="tab" id="tab-week2" aria-controls="week2-panel" aria-selected="false" tabindex="-1">Week 2</button>
    <button role="tab" id="tab-week3" aria-controls="week3-panel" aria-selected="false" tabindex="-1">Week 3</button>
  </nav>

  <section id="week1-panel" role="tabpanel" aria-labelledby="tab-week1">
    <h2>Week 1 <span>Loaders · 6 projects</span></h2>
    <div class="grid" id="week1"></div>
  </section>

  <section id="week2-panel" role="tabpanel" aria-labelledby="tab-week2" hidden>
    <h2>Week 2 <span>Badges &amp; Tooltips · 7 sets</span></h2>
    <div class="grid" id="week2"></div>
  </section>
  <section id="week3-panel" role="tabpanel" aria-labelledby="tab-week3" hidden>
    <h2>Week 3 <span>Pixel salon · 3 components</span></h2>
    <div class="grid" id="week3"></div>
  </section>
</main>

<script>
  const week1 = [
    { dir: "glitter-diary-loader", name: "Glitter Diary",
      desc: "A 2010s sticker diary. Pages flip and LOADING is pressed on one letter sticker at a time." },
    { dir: "diamond-bee-loader", name: "The Diamond Bee",
      desc: "A 3D gold and platinum bee brooch in three.js that takes flight as the honeycomb fills." },
    { dir: "fresh-cut-loader", name: "Fresh Cut",
      desc: "A 90s film still. An invisible blade trims the fringe lock by lock as progress rises." },
    { dir: "washi-lobby-loader", name: "Washi Lobby",
      desc: "An ink sketch of a hotel lobby that fills with colour from the skylight down." },
    { dir: "coupe-loader", name: "The Coupe",
      desc: "A champagne coupe filled frame by frame by a pour driven by progress." },
    { dir: "pisces-loader", name: "Pisces",
      desc: "An art deco constellation. A gold line links all 16 stars of Pisces." },
  ];

  const week2 = [
    { dir: "bloom", name: "Bloom", desc: "Zen" },
    { dir: "dandelion", name: "Dandelion", desc: "Playful" },
    { dir: "firefly", name: "Firefly", desc: "Intimate" },
    { dir: "harvest", name: "Harvest", desc: "Quirky" },
    { dir: "shy", name: "Shy Icon", desc: "Quirky" },
    { dir: "motion", name: "Motion Study", desc: "All five sets with the same parts, so only the motion changes. Desktop and mobile." },
    { dir: "tones", name: "Five Tones", desc: "Playful, Futuristic, Elegant, Raw, Nostalgic" },
  ];

  const week3 = [
    { dir: "salon-timer", name: "Salon Timer", desc: "A pixel hairdryer lifts a rolling ball to start the timer. Color, airflow and motion follow its state." },
    { dir: "salon-checklist", name: "Salon Checklist", desc: "Pixel checkboxes fill with blue, stars track progress, and confetti celebrates a finished routine." },
    { dir: "sliding-pearl", name: "Sliding Pearl", desc: "A pixel pearl rolls along a dotted path, changing color with each finishing choice." },
  ];

  function render(id, week, list) {
  const grid = document.getElementById(id);
  for (const p of list) {
    const url = `${week}/${p.dir}/`;
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <a class="preview" href="${url}" tabindex="-1" aria-hidden="true">
        <iframe src="${url}" loading="lazy" title="${p.name} preview" tabindex="-1"></iframe>
      </a>
      <div class="body">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="links">
          <a href="${url}">Open demo →</a>
          <a href="https://github.com/dwan11/Adv-Interface/tree/main/${week}/${p.dir}">Code</a>
        </div>
      </div>`;
    grid.appendChild(card);
  }
  }
  render("week3", "week3", week3);
  render("week2", "week2", week2);
  render("week1", "week1", week1);

  // Tabs: one week visible at a time; the URL hash (#week2) keeps the choice linkable.
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function show(week, focus = false) {
    for (const t of tabs) {
      const on = t.id === `tab-${week}`;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
      if (on && focus) t.focus();
    }
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => { const w = t.id.slice(4); show(w); history.replaceState(null, "", `#${w}`); });
    t.addEventListener("keydown", (e) => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (d) { const n = tabs[(i + d + tabs.length) % tabs.length]; n.click(); n.focus(); }
    });
  });
  const fromHash = () => show(tabs.some((t) => t.id === `tab-${location.hash.slice(1)}`) ? location.hash.slice(1) : "week1");
  addEventListener("hashchange", fromHash);
  fromHash();
</script>
</body>
</html>
