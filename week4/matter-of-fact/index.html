<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matter of Fact · Adv Interface</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fbfaf7; --ink: #1f1e1c; --muted: #77736b; --line: #e7e3da;
    --track: #2a2a2a; --track-hover: #3a3a3a; --dot: #8d8a84; --dot-on: rgba(255, 255, 255, .78);
    --thumb: #fdf5c4; --thumb-deep: #efdf8a; --thumb-edge: rgba(80, 70, 20, .16); --ring: #8c8564;
    --teal: #13c8c0; --teal-2: #7fe6dc; --magenta: #d3177a;
    --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #131312; --ink: #eeebe4; --muted: #9a958c; --line: #2a2926;
      --track: #3c3c3a; --track-hover: #4a4a47; --dot: #7c7870; --dot-on: rgba(255, 255, 255, .7);
      --thumb: #f4ebb5; --thumb-deep: #fff6c8; --thumb-edge: rgba(0, 0, 0, .4); --ring: #c2b98a;
      --teal: #19d6cd; --teal-2: #8ff0e8; --magenta: #ec3d93;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/22px var(--font); -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body { display: grid; place-items: center; }
  .page { width: min(560px, 100%); padding: 48px 16px; display: grid; gap: 40px; }
  figure { margin: 0; }
  /* HIG caption 1: 12px, secondary label */
  figcaption { font: 500 12px/16px var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding-left: 22px; }

  /* ---------- Slider ---------- */
  @property --mix { syntax: "<number>"; inherits: true; initial-value: 0; }
  .slider { --pad: 22px; --f: 0; --g: 0; --th: 10px; position: relative; height: 92px; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; outline: none;
    /* One colour story for both sliders: teal blends toward magenta as the value rises. */
    --accent: color-mix(in oklch, var(--teal), var(--magenta) calc(var(--mix) * 1%));
    --accent-2: color-mix(in oklch, var(--teal), var(--magenta) calc(min(100, var(--mix) + 14) * 1%));
    transition: --mix .9s cubic-bezier(.4, 0, .2, 1); }
  .track { position: absolute; left: var(--pad); right: var(--pad); top: 50%; height: var(--th); translate: 0 -50%; border-radius: 99px; background: var(--track); transition: background-color .25s; }
  .slider[data-hover] .track { background: var(--track); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--f) * 100%); border-radius: inherit;
    background: var(--accent) linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent)) 0 0 / 200% 100%; animation: flow 9s linear infinite; transition: filter .25s; }
  .slider:is([data-pressed], [data-drag]) .fill { filter: brightness(1.03) saturate(1.03); }
  @keyframes flow { to { background-position: 200% 0; } }
  .dot { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--dot); transition: background-color .2s, scale .2s ease-out; }
  .dot[hidden] { display: none; }
  .dot[data-on] { background: var(--dot-on); }
  .dot[data-near] { scale: 1.15; background: var(--thumb); }
  .dot.ping { animation: ping .38s ease-out; }
  @keyframes ping { 30% { scale: 1.15; } 100% { scale: 1; } }

  /* Thumb: a 32px circle. Layers, back to front: halo (state layer), orbit streak, cap. */
  .thumb { position: absolute; top: 50%; left: calc(var(--pad) + var(--f) * (100% - 2 * var(--pad))); width: 32px; height: 32px; margin: -16px 0 0 -16px; }
  .halo { position: absolute; inset: -12px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 18%, transparent); opacity: 0; scale: .5; pointer-events: none;
    transition: opacity .25s ease-out, scale .35s cubic-bezier(.3, 1.3, .5, 1); }
  .slider[data-thumb] .halo { opacity: 0; }
  .slider:is([data-pressed], [data-drag]) .halo { opacity: 1; scale: 1.18; background: color-mix(in srgb, var(--accent) 24%, transparent); }
  .cap { position: relative; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fffdf0, var(--thumb) 60%);
    box-shadow: inset 0 -2px 0 var(--thumb-edge), 0 1px 2px rgba(0, 0, 0, .2);
    transition: scale .24s cubic-bezier(.3, 1.4, .5, 1), translate .24s cubic-bezier(.3, 1.4, .5, 1), box-shadow .2s ease-out; }

  .slider:is([data-pressed], [data-drag]) .cap { scale: 1.2; translate: 0 0; box-shadow: inset 0 -2px 0 var(--thumb-edge), 0 3px 8px rgba(0, 0, 0, .22); }
  .slider:focus-visible .cap { box-shadow: inset 0 -2px 0 var(--thumb-edge), 0 0 0 3px var(--paper), 0 0 0 5px var(--accent); }
  /* Orbit: a streak travels the motion path around the thumb, like a trim-path comet. */
  @property --orbit { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .orbit, .orbit::before { position: absolute; inset: -7px; border-radius: 50%; pointer-events: none;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); }
  .orbit { opacity: 0; scale: .86; transition: opacity .22s ease-out, scale .3s cubic-bezier(.3, 1.3, .5, 1);
    background: conic-gradient(from var(--orbit), transparent 0deg 150deg, color-mix(in srgb, var(--thumb-deep) 40%, transparent) 260deg, var(--thumb-deep) 345deg, var(--thumb) 358deg, transparent 360deg);
    animation: orbit 1.25s linear infinite; }
  .orbit::before { content: ""; inset: 0; background: var(--thumb-deep); opacity: .35; }
  @keyframes orbit { to { --orbit: 360deg; } }
  .slider[data-thumb]:not([data-pressed]) .orbit { opacity: 1; scale: 1; }
  .slider[data-thumb] .orbit { scale: 1; }

  /* Value bubble: digits flip in stop-motion steps, then hold. */
  .tag { position: absolute; bottom: calc(50% + 26px); left: calc(var(--pad) + var(--f) * (100% - 2 * var(--pad))); display: flex; align-items: center; height: 24px; padding: 0 8px;
    border-radius: 8px; background: var(--ink); color: var(--paper); font: 500 12px/16px var(--font); font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .35); opacity: 0; translate: -50% 6px; scale: 1; transform-origin: 50% 100%; pointer-events: none;
    transition: opacity .16s ease-out, translate .18s ease-out, scale .18s ease-out; }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 7px; height: 7px; margin-left: -3.5px; background: inherit; border-radius: 1.5px; rotate: 45deg; }
  .slider:is([data-thumb], [data-pressed], [data-drag], :focus-visible) .tag { opacity: 1; translate: -50% 0; scale: 1; }
  .slider:is([data-pressed], [data-drag]) .tag { translate: -50% -4px; }
  .drum { position: relative; width: .56em; height: 1.2em; overflow: hidden; transition: width .2s ease-out; }
  .drum[data-lead] { width: 0; }
  .digit { position: absolute; inset: 0; text-align: center; line-height: 1.2em; }

  /* Track preview: hovering the bar (not the thumb) shows where a press would land. */
  .ghost, .ghost-tag { position: absolute; left: calc(var(--pad) + var(--g) * (100% - 2 * var(--pad))); pointer-events: none; opacity: 0; transition: opacity .18s ease-out; }
  .ghost { top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid var(--thumb-deep); background: color-mix(in srgb, var(--thumb) 35%, transparent); }
  .ghost-tag { display: flex; align-items: center; bottom: calc(50% + 16px); translate: -50% 4px; font: 500 12px/16px var(--font); font-variant-numeric: tabular-nums; color: var(--muted); transition: opacity .18s ease-out, translate .22s cubic-bezier(.3, 1.3, .5, 1); }
  .slider[data-kind="stepped"] :is(.ghost, .ghost-tag) { transition: opacity .18s ease-out, translate .22s cubic-bezier(.3, 1.3, .5, 1), left .18s cubic-bezier(.2, .8, .2, 1); }
  .slider[data-preview]:not([data-pressed]) :is(.ghost, .ghost-tag) { opacity: .55; }
  .ghost { visibility: hidden; }
  .slider[data-preview]:not([data-pressed]) .ghost-tag { translate: -50% 0; }

  @media (prefers-reduced-motion: reduce) { .cap, .halo, .tag, .ghost, .ghost-tag, .track, .drum, .fill, .dot, .orbit, .slider { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a href="../../design-checklist/" aria-label="Open design checklist" title="Design checklist" style="position:fixed;top:16px;right:16px;z-index:1000;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:#fffdfa;color:#506646;border:1px solid #deded3;text-decoration:none;font:13px system-ui,sans-serif"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m6 8 1.5 1.5L10 7M12 8h6m-12 7 1.5 1.5L10 14m2 1h6"/></svg>Design checklist</a>
<main class="page">
  <figure>
    <div class="slider" data-kind="continuous" data-value="35" data-store="mof-continuous" data-label="Continuous"></div>
    <figcaption>Continuous</figcaption>
  </figure>
  <figure>
    <div class="slider" data-kind="stepped" data-stops="5" data-value="25" data-store="mof-stepped" data-label="Stepped"></div>
    <figcaption>Stepped</figcaption>
  </figure>
</main>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return Number.isFinite(v) ? v : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // Damped spring, integrated with small fixed substeps so stiff settings stay stable.
  function stepSpring(s, k, c, dt) {
    const n = Math.ceil(dt / (1 / 240)), h = dt / n;
    let a = 0;
    for (let i = 0; i < n; i++) { a = -k * (s.x - s.t) - c * s.v; s.v += a * h; s.x += s.v * h; }
    return a;
  }

  class FactSlider {
    constructor(el) {
      this.el = el;
      this.stepped = el.dataset.kind === "stepped";
      this.stops = +el.dataset.stops || 5;
      let v = +el.dataset.value || 0;
      if (el.dataset.store) v = store.get(el.dataset.store, v);
      this.value = this.quantize(v);
      const f = this.value / 100;
      this.pos = { x: f, v: 0, t: f };
      this.build();
      this.shown = this.value; this.lastFlip = -1e9;
      this.digits(this.value).forEach((n, i) => { this.drums[i].digit = n; this.drums[i].a.textContent = n; });
      this.markLead();
      this.apply();
      this.bind();
    }
    quantize(v) {
      v = clamp(Math.round(v), 0, 100);
      if (!this.stepped) return v;
      const unit = 100 / (this.stops - 1);
      return Math.round(v / unit) * unit;
    }
    digits(v) { return String(Math.round(v)).padStart(3, "0").split("").map(Number); }
    build() {
      const el = this.el;
      el.innerHTML = `<div class="track"><div class="fill"></div></div><div class="ghost"></div><div class="thumb"><div class="halo"></div><div class="orbit"></div><div class="cap"></div></div><div class="tag" aria-hidden="true"></div><div class="ghost-tag" aria-hidden="true"></div>`;
      this.ghostTag = el.querySelector(".ghost-tag");
      this.track = el.querySelector(".track");
      this.thumb = el.querySelector(".thumb");
      this.dots = [];
      if (this.stepped) for (let i = 0; i < this.stops; i++) {
        const d = document.createElement("i");
        d.className = "dot"; d.style.left = (i / (this.stops - 1) * 100) + "%";
        if (i === 0 || i === this.stops - 1) d.hidden = true; // the ends are the track caps
        this.track.append(d); this.dots.push(d);
      }
      const tag = el.querySelector(".tag");
      const buildDigits = (tag) => [0, 1, 2].map(() => {
        const drum = document.createElement("span"); drum.className = "drum";
        const a = document.createElement("span"), b = document.createElement("span");
        a.className = b.className = "digit";
        drum.append(a, b); tag.append(drum);
        return { drum, a, b, digit: 0, next: null, dir: 0, t0: 0 };
      });
      this.drums = buildDigits(tag);
      this.previewDrums = buildDigits(this.ghostTag);
      this.previewShown = 0; this.previewValue = 0; this.previewLastFlip = -Infinity;
      this.previewDrums.forEach(d => d.a.textContent = "0");
      this.markLead(0, this.previewDrums);
      this.lastDot = Math.round(this.pos.x * (this.stops - 1));
      el.tabIndex = 0;
      el.setAttribute("role", "slider");
      el.setAttribute("aria-label", el.dataset.label || "Value");
      el.setAttribute("aria-valuemin", 0);
      el.setAttribute("aria-valuemax", 100);
    }
    get dragging() { return this.el.hasAttribute("data-drag"); }

    setValue(v, { animate = true } = {}) {
      v = this.quantize(v);
      const changed = v !== this.value;
      this.value = v;
      if (changed && this.stepped) this.glide = { from: this.pos.x, start: performance.now(), duration: 440 };
      this.pos.t = v / 100;
      if (!animate || reduce.matches) { this.pos.x = this.pos.t; this.pos.v = 0; }
      if (changed) this.apply();
    }
    apply() {
      const el = this.el;
      el.setAttribute("aria-valuenow", this.value);
      el.setAttribute("aria-valuetext", this.value + " percent");
      el.style.setProperty("--mix", this.value);
    }
    markLead(value = this.shown, drums = this.drums) {
      const d = this.digits(value);
      drums[0].drum.toggleAttribute("data-lead", d[0] === 0);
      drums[1].drum.toggleAttribute("data-lead", d[0] === 0 && d[1] === 0);
    }
    // Three discrete frames over 80ms, followed by at least 160ms of readable stillness.
    flip(now, preview = false) {
      const drums = preview ? this.previewDrums : this.drums;
      const value = preview ? this.previewValue : this.value;
      const shown = preview ? this.previewShown : this.shown;
      drums.forEach(d => this.land(d));
      const next = this.digits(value), dir = Math.sign(value - shown) || 1;
      drums.forEach((d, i) => {
        if (next[i] === d.digit) return;
        d.next = next[i]; d.dir = dir; d.t0 = now; d.b.textContent = next[i];
        if (reduce.matches) this.land(d);
      });
      if (preview) { this.previewShown = value; this.previewLastFlip = now; }
      else { this.shown = value; this.lastFlip = now; }
      this.markLead(value, drums);
    }
    land(d) {
      if (d.next === null) return;
      d.digit = d.next; d.next = null; d.a.textContent = d.digit; d.b.textContent = "";
      d.a.style.transform = d.b.style.transform = "";
    }
    // Preview a press position (f in 0–1), or clear it with null. Stepped previews snap to a stop.
    preview(f) {
      const el = this.el;
      if (f == null) { el.removeAttribute("data-preview"); this.dots.forEach((d) => d.removeAttribute("data-near")); return; }
      const i = Math.round(f * (this.stops - 1));
      this.dots.forEach((d, n) => d.toggleAttribute("data-near", this.stepped && n === i));
      el.style.setProperty("--g", f.toFixed(4));
      this.previewValue = Math.round(f * 100);
      if (!el.hasAttribute("data-preview")) {
        // On entry show the correct value; subsequent changes share the drag flip.
        this.flip(performance.now(), true);
        this.previewDrums.forEach(d => this.land(d));
      }
      el.dataset.preview = "";
    }
    fromPointer(e) {
      const r = this.track.getBoundingClientRect();
      return clamp((e.clientX - r.left) / r.width, 0, 1);
    }
    bind() {
      const el = this.el;
      el.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") el.dataset.hover = ""; });
      el.addEventListener("pointerleave", () => { el.removeAttribute("data-hover"); el.removeAttribute("data-thumb"); this.preview(null); });
      // Hover has two targets: the thumb (lift + value bubble) and the bar (a ghost showing where a press lands).
      el.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        if (el.hasAttribute("data-pressed")) { el.removeAttribute("data-thumb"); return this.preview(null); }
        const tr = this.thumb.getBoundingClientRect();
        const onThumb = Math.abs(e.clientX - (tr.left + tr.right) / 2) < tr.width / 2 + 6;
        el.toggleAttribute("data-thumb", onThumb);
        if (onThumb) return this.preview(null);
        let f = this.fromPointer(e);
        if (this.stepped) f = Math.round(f * (this.stops - 1)) / (this.stops - 1);
        this.preview(f);
      });
      el.addEventListener("pointerdown", (e) => {
        if (e.button) return;
        try { el.setPointerCapture(e.pointerId); } catch {}
        el.dataset.pressed = "";
        this.preview(null);
        const f = this.fromPointer(e);
        const tr = this.thumb.getBoundingClientRect();
        const onThumb = e.clientX >= tr.left - 6 && e.clientX <= tr.right + 6;
        this.grab = onThumb ? f - this.pos.x : 0;
        this.downX = e.clientX;
        if (!onThumb) this.setValue(f * 100);
      });
      el.addEventListener("pointermove", (e) => {
        if (!el.hasAttribute("data-pressed")) return;
        if (!this.dragging && Math.abs(e.clientX - this.downX) < 3) return;
        el.dataset.drag = "";
        const f = clamp(this.fromPointer(e) - this.grab, 0, 1);
        this.setValue(f * 100);
        if (!this.stepped) { this.pos.x = this.pos.t = f; this.pos.v = 0; } // matter of fact: 1:1, no lag
      });
      const end = () => {
        this.flip(performance.now());
        this.drums.forEach((d) => this.land(d));
        el.removeAttribute("data-pressed"); el.removeAttribute("data-drag");
        if (el.dataset.store) store.set(el.dataset.store, this.value);
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
      el.addEventListener("keydown", (e) => {
        const unit = this.stepped ? 100 / (this.stops - 1) : (e.shiftKey ? 10 : 1);
        const map = { ArrowRight: unit, ArrowUp: unit, ArrowLeft: -unit, ArrowDown: -unit, PageUp: this.stepped ? unit : 10, PageDown: this.stepped ? -unit : -10 };
        let next;
        if (e.key in map) next = this.value + map[e.key];
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = 100;
        else return;
        e.preventDefault();
        this.setValue(next);
        if (el.dataset.store) store.set(el.dataset.store, this.value);
      });
    }

    tick(dt, now) {
      const p = this.pos;
      if (reduce.matches) { p.x = p.t; p.v = 0; this.glide = null; }
      else if (this.stepped && this.glide) {
        const t = clamp((now - this.glide.start) / this.glide.duration, 0, 1);
        // A finite, non-overshooting glide: no stored spring energy or rebound.
        const eased = 1 - Math.pow(1 - t, 3);
        p.x = this.glide.from + (p.t - this.glide.from) * eased;
        p.v = 0;
        if (t === 1) this.glide = null;
      } else if (!this.stepped) stepSpring(p, 520, 46, dt);
      this.el.style.setProperty("--f", p.x.toFixed(4));

      if (this.stepped) {
        const near = Math.round(p.x * (this.stops - 1));
        if (near !== this.lastDot && Math.abs(p.x * (this.stops - 1) - near) < .12) {
          const d = this.dots[near]; d.classList.remove("ping"); void d.offsetWidth; d.classList.add("ping");
          this.lastDot = near;
        }
        this.dots.forEach((d, i) => d.toggleAttribute("data-on", i / (this.stops - 1) < p.x - .01));
      }
      const hold = 240;
      if (this.shown !== this.value && now - this.lastFlip >= hold) this.flip(now);
      if (this.previewShown !== this.previewValue && now - this.previewLastFlip >= hold) this.flip(now, true);
      this.animateDigits(this.drums, now);
      this.animateDigits(this.previewDrums, now);
    }
    animateDigits(drums, now) {
      for (const d of drums) {
        if (d.next === null) continue;
        const t = (now - d.t0) / 80;
        if (t >= 1) { this.land(d); continue; }
        const q = Math.min(1, (Math.floor(t * 3) + 1) / 3); // three held frames, not a smooth roll
        d.a.style.transform = `translateY(${-d.dir * q * 100}%)`;
        d.b.style.transform = `translateY(${d.dir * (1 - q) * 100}%)`;
      }
    }
  }

  const sliders = [...document.querySelectorAll(".slider")].map((el) => new FactSlider(el));
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const s of sliders) s.tick(dt, now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
