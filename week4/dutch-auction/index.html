<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dutch Auction · Adv Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --studio-top: #f6f8fa; --studio-low: #dce2e7; --grid: rgba(30, 60, 80, .06);
    --alu-hi: #fdfefe; --alu: #eaeef1; --alu-lo: #d2d9df;
    --ink: #1c2630; --label: #7f8c97;
    --emerald: #00b56f; --neon: #2dffa0; --crimson: #e5163f; --amber: #f0961a;
    --mono: "JetBrains Mono", ui-monospace, monospace; --grotesk: "Space Grotesk", "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow-x: hidden; color: var(--ink); font-family: var(--grotesk);
    background: radial-gradient(1200px 700px at 50% 10%, var(--studio-top), var(--studio-low) 80%); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 44px 44px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 10%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 55%, #000 10%, transparent 70%); }
  main { display: flex; flex-wrap: wrap; justify-content: center; gap: 56px 64px; padding: 72px 16px; perspective: 1800px; }
  figure { position: relative; margin: 0; display: grid; justify-items: center; gap: 26px; }
  /* Studio light behind, contact shadow below */
  figure::before { content: ""; position: absolute; inset: -4% -10% 22%; z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .95), rgba(0, 181, 111, .07) 70%, transparent); filter: blur(30px); }
  figure::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 30px; height: 26px; z-index: -1; border-radius: 50%;
    background: rgba(20, 35, 50, .38); filter: blur(16px); transition: transform .7s var(--ease), opacity .7s; }
  figure:has(.device:not([data-state="idle"]))::after { transform: scale(.92); opacity: .7; }
  figcaption { font: 600 11px/1 var(--grotesk); letter-spacing: .26em; text-transform: uppercase; color: var(--label); }

  .device { position: relative; width: min(360px, calc(100vw - 32px)); padding: 14px; border-radius: 26px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .5) 0 1px, transparent 1px 3px), linear-gradient(165deg, var(--alu-hi), var(--alu) 42%, var(--alu-lo));
    box-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 rgba(20, 35, 50, .08), 0 0 0 1px rgba(20, 35, 50, .1),
      0 2px 3px rgba(20, 35, 50, .08), 0 14px 28px -10px rgba(20, 35, 50, .22), 0 50px 80px -40px rgba(20, 35, 50, .45);
    transform: rotateX(12deg); transform-origin: 50% 70%; transition: transform .7s var(--ease), box-shadow .7s var(--ease); }
  .device:not([data-state="idle"]) { transform: rotateX(5deg) translateY(-6px);
    box-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 rgba(20, 35, 50, .08), 0 0 0 1px rgba(20, 35, 50, .1),
      0 2px 3px rgba(20, 35, 50, .06), 0 22px 40px -12px rgba(20, 35, 50, .28), 0 70px 100px -40px rgba(20, 35, 50, .5); }
  .screw { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #a9b3bb 70%); box-shadow: 0 .5px 0 #fff, inset 0 0 0 .5px rgba(20, 35, 50, .25); }
  .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3px; height: 1px; background: rgba(20, 35, 50, .35); rotate: 35deg; }

  .data { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .box { position: relative; min-width: 0; padding: 7px 9px 8px; border-radius: 7px; background: linear-gradient(#f4f6f8, #eaeef1);
    box-shadow: inset 0 1px 2px rgba(20, 35, 50, .1), inset 0 0 0 1px rgba(20, 35, 50, .07), 0 1px 0 #fff; transition: box-shadow .3s; }
  .box[data-live] { box-shadow: inset 0 1px 2px rgba(20, 35, 50, .1), inset 0 0 0 1px rgba(0, 181, 111, .45), 0 1px 0 #fff, 0 0 0 3px rgba(0, 181, 111, .08); }
  .box b { display: block; margin-bottom: 6px; font: 600 9px/1 var(--grotesk); letter-spacing: .18em; text-transform: uppercase; color: var(--label); }
  .box > span { display: block; font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spark { display: block; width: 100%; height: 12px; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--emerald); stroke-width: 1.4; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .spark circle { fill: var(--emerald); }
  .led { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; vertical-align: 1px; background: #b9c2c9; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .2); transition: background-color .2s, box-shadow .2s; }
  .device[data-state="hover"] .led { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
  .device[data-state="press"] .led { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .device[data-state="drag"] .led { background: var(--crimson); box-shadow: 0 0 8px var(--crimson); }
  .device[data-state="input"] .led { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .up { color: var(--emerald); } .down { color: var(--crimson); }

  /* ---------- Dial ---------- */
  .dial-wrap { position: relative; container-type: inline-size; margin: 8px 0; }
  .dial { display: block; width: 100%; touch-action: none; cursor: crosshair; outline: none; overflow: visible; -webkit-user-select: none; user-select: none; }
  .device[data-state="drag"] .dial { cursor: grabbing; }
  .tick { stroke-linecap: round; }
  .lbl { font: 500 8px var(--mono); fill: #94a0aa; text-anchor: middle; dominant-baseline: central; transition: fill .2s; }
  .lbl[data-near] { fill: var(--ink); }
  .bloom { opacity: .3; transition: opacity .35s ease-out; }
  .device:is([data-state="hover"], [data-state="input"]) .bloom { opacity: .55; }
  .device:is([data-state="press"], [data-state="drag"]) .bloom { opacity: .8; }
  .shine { stroke: #c9ffe6; stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 7 93; animation: shine 3.4s linear infinite; }
  @keyframes shine { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  .device:is([data-state="press"], [data-state="drag"]) .shine { opacity: 0; }
  .needle line { stroke: var(--crimson); stroke-width: 1.5; stroke-linecap: round; transition: stroke-width .15s; }
  .device:is([data-state="press"], [data-state="drag"]) .needle line { stroke-width: 2.3; }
  .ghost { opacity: 0; transition: opacity .2s; }
  .ghost line { stroke: var(--crimson); stroke-width: 1.2; stroke-dasharray: 2 4; }
  .device:is([data-state="hover"], [data-state="input"]) .ghost { opacity: .6; }
  .glass { transform-box: view-box; transform-origin: 160px 160px; transition: transform .25s var(--ease); }
  .device:is([data-state="press"], [data-state="drag"]) .glass { transform: scale(.975); }
  .sweep { transform-box: view-box; transform-origin: 160px 160px; opacity: 0; transition: opacity .4s; animation: spin 2.6s linear infinite; }
  .device[data-state="hover"] .sweep { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pulse { transform-box: view-box; transform-origin: 160px 160px; opacity: 0; fill: none; stroke: var(--emerald); stroke-width: 1.4; }
  .pulse.go { animation: pulse .7s var(--ease); }
  @keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.62); } }
  .focus { opacity: 0; fill: none; stroke: var(--emerald); stroke-width: 1.2; stroke-dasharray: 3 5; }
  .dial:focus-visible .focus { opacity: 1; }

  /* ---------- Centre readout: an editable price on smoked glass ---------- */
  .readout { position: absolute; left: 50%; top: 50%; translate: -50% -50%; display: grid; justify-items: center; gap: 1.4cqw; pointer-events: none; transition: scale .25s var(--ease); }
  .device:is([data-state="press"], [data-state="drag"]) .readout { scale: .975; }
  .meta { font: 600 2.35cqw/1 var(--grotesk); letter-spacing: .24em; text-transform: uppercase; color: #6f8290; white-space: nowrap; }
  .hint { position: relative; display: block; width: 30cqw; height: 2.35cqw; }
  .hint span { position: absolute; left: 50%; translate: -50% 0; opacity: 0; transition: opacity .2s, translate .25s var(--ease); }
  .hint .h-idle { opacity: 1; }
  .amount { position: relative; display: flex; align-items: baseline; padding: .6cqw 2.2cqw .9cqw; border-radius: 1.8cqw; pointer-events: auto; cursor: text;
    font: 500 13.75cqw/1 var(--mono); letter-spacing: -.04em; color: var(--neon);
    text-shadow: 0 0 2px rgba(45, 255, 160, .7), 0 0 14px rgba(45, 255, 160, .45);
    transition: background-color .25s, color .25s, text-shadow .25s; }
  .amount .cur { opacity: .85; transition: opacity .25s; }
  .amount input { width: 4ch; padding: 0; border: 0; outline: none; background: none; font: inherit; letter-spacing: inherit; color: inherit; text-shadow: inherit; caret-color: var(--neon); text-align: center; }
  /* Corner brackets (hover + typing) */
  .amount::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s, inset .3s var(--ease);
    --c: rgba(45, 255, 160, .55); --l: 2.6cqw;
    background:
      linear-gradient(var(--c), var(--c)) top left / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) top left / 1px var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) top right / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) top right / 1px var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom left / 1px var(--l) no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / var(--l) 1px no-repeat, linear-gradient(var(--c), var(--c)) bottom right / 1px var(--l) no-repeat; }
  /* Scan line (typing) */
  .amount::after { content: ""; position: absolute; left: 2.2cqw; right: 2.2cqw; bottom: .5cqw; height: 1px; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: linear-gradient(90deg, transparent, var(--neon), transparent) 0 0 / 40% 100% no-repeat; }
  /* Hover */
  .amount:hover { background: rgba(45, 255, 160, .06); text-shadow: 0 0 2px rgba(45, 255, 160, .8), 0 0 18px rgba(45, 255, 160, .6); }
  .amount:hover::before { opacity: 1; inset: -.6cqw; }
  .readout:has(.amount:hover) .h-idle { opacity: 0; translate: -50% -3px; }
  .readout:has(.amount:hover) .h-edit { opacity: 1; translate: -50% 0; }
  /* Typing */
  .amount:focus-within { background: rgba(45, 255, 160, .1); color: #eafff4; text-shadow: 0 0 3px rgba(45, 255, 160, .9), 0 0 22px rgba(45, 255, 160, .7); }
  .amount:focus-within::before { opacity: 1; inset: -.6cqw; --c: var(--neon); }
  .amount:focus-within::after { opacity: 1; animation: scan 1.4s ease-in-out infinite alternate; }
  .amount:focus-within .cur { opacity: .5; }
  @keyframes scan { from { background-position: 0 0; } to { background-position: 100% 0; } }
  .readout:has(.amount:focus-within) .hint span { opacity: 0; translate: -50% -3px; }
  .readout:has(.amount:focus-within) .h-type { opacity: 1; translate: -50% 0; color: var(--neon); }
  .amount[data-error] { animation: nudge .3s; }
  @keyframes nudge { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }

  @media (prefers-reduced-motion: reduce) {
    .device, .bloom, .glass, .ghost, .sweep, .needle line, .readout, .amount, .amount::before, figure::after { transition: none; }
    .sweep, .pulse.go, .shine, .amount::after, .amount[data-error], .led { animation: none !important; }
    .device:not([data-state="idle"]) { transform: rotateX(12deg); }
  }
</style>
</head>
<body>
<main>
  <figure>
    <div class="device" data-kind="continuous" data-value="105" data-store="auction-continuous" data-label="Continuous bid" data-lot="0482" data-variety="ROSE · RED"></div>
    <figcaption>Continuous</figcaption>
  </figure>
  <figure>
    <div class="device" data-kind="stepped" data-value="100" data-store="auction-stepped" data-label="Stepped bid" data-lot="0483" data-variety="TULIP · A1"></div>
    <figcaption>Stepped</figcaption>
  </figure>
</main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return Number.isFinite(v) ? v : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function spring(s, k, c, dt) {
    const n = Math.ceil(dt / (1 / 240)), h = dt / n;
    for (let i = 0; i < n; i++) { s.v += (-k * (s.x - s.t) - c * s.v) * h; s.x += s.v * h; }
  }

  // Dial geometry: a 300° arc opening at the bottom; angles clockwise from 12 o'clock.
  const C = 160, MAX = 200, SWEEP = 300, START = -150;
  const angleOf = (t) => START + SWEEP * t;
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return [C + r * Math.sin(a), C - r * Math.cos(a)]; };
  const arc = (r, a0, a1) => {
    if (a1 - a0 < .05) return "";
    const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const dollars = (c) => (c / 100).toFixed(2);
  const money = (c) => "$" + dollars(c);

  let uid = 0;
  class AuctionClock {
    constructor(dev) {
      this.dev = dev;
      this.id = "a" + uid++;
      this.stepped = dev.dataset.kind === "stepped";
      this.unit = this.stepped ? 25 : 1;
      this.ticks = this.stepped ? 41 : 81; // a major tick every 25¢ in both
      this.major = (this.ticks - 1) / 8;
      let v = +dev.dataset.value;
      if (dev.dataset.store) v = store.get(dev.dataset.store, v);
      this.value = this.quantize(v);
      this.needle = { x: this.value / MAX, v: 0, t: this.value / MAX };
      this.lastT = this.needle.x;
      this.boost = new Float32Array(this.ticks);
      this.boostUp = new Uint8Array(this.ticks);
      this.delta = 0; this.preview = null; this.scramble = []; this.shownText = ""; this.typed = false;
      this.history = Array(40).fill(this.value); this.sampleClock = 1;
      this.build();
      this.bind();
      this.setState("idle");
      this.report();
    }
    quantize(v) { return clamp(Math.round(v / this.unit) * this.unit, 0, MAX); }
    build() {
      const d = this.dev, id = this.id;
      d.innerHTML = `
        <i class="screw" style="left:10px;top:10px"></i><i class="screw" style="right:10px;top:10px"></i>
        <i class="screw" style="left:10px;bottom:10px"></i><i class="screw" style="right:10px;bottom:10px"></i>
        <div class="data">
          <div class="box"><b>Lot</b><span>${d.dataset.lot}</span></div>
          <div class="box"><b>Variety</b><span>${d.dataset.variety}</span></div>
          <div class="box"><b>Trend</b><svg class="spark" viewBox="0 0 39 12" preserveAspectRatio="none" aria-hidden="true"><polyline/><circle r="1.6"/></svg></div>
        </div>
        <div class="dial-wrap">
          <svg class="dial" viewBox="0 0 320 320" tabindex="0" role="slider" aria-label="${d.dataset.label}" aria-valuemin="0" aria-valuemax="${MAX}">
            <defs>
              <linearGradient id="${id}-bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#cdd5db"/><stop offset="1" stop-color="#eef1f4"/></linearGradient>
              <linearGradient id="${id}-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf0"/><stop offset="1" stop-color="#f7f9fa"/></linearGradient>
              <radialGradient id="${id}-glass" cx=".42" cy=".3" r=".85"><stop offset="0" stop-color="#1d2a32"/><stop offset=".6" stop-color="#0b1116"/><stop offset="1" stop-color="#05080a"/></radialGradient>
              <linearGradient id="${id}-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#2dffa0" stop-opacity=".25"/></linearGradient>
              <linearGradient id="${id}-spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
              <linearGradient id="${id}-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00b56f" stop-opacity="0"/><stop offset="1" stop-color="#00b56f" stop-opacity=".16"/></linearGradient>
              <filter id="${id}-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
              <filter id="${id}-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
              <filter id="${id}-drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#14232f" flood-opacity=".35"/></filter>
            </defs>
            <circle cx="160" cy="160" r="156" fill="url(#${id}-bezel)" stroke="rgba(20,35,50,.12)"/>
            <circle cx="160" cy="160" r="148" fill="url(#${id}-face)"/>
            <circle cx="160" cy="160" r="146" fill="none" stroke="rgba(20,35,50,.14)" stroke-width="4" filter="url(#${id}-soft)"/>
            <circle class="focus" cx="160" cy="160" r="152"/>
            <g class="sweep"><path d="${arc(124, -40, 0)}" stroke="url(#${id}-sweep)" stroke-width="28" fill="none"/></g>
            <path d="${arc(140, START, START + SWEEP)}" stroke="#d9dfe4" stroke-width="3" fill="none" stroke-linecap="round"/>
            <g id="${id}-lit"><path class="track" stroke="#00b56f" stroke-width="3" fill="none" stroke-linecap="round"/><g class="ticks"></g></g>
            <use class="bloom" href="#${id}-lit" filter="url(#${id}-blur)"/>
            <path class="shine" pathLength="100"/>
            <g class="labels"></g>
            <circle class="pulse" cx="160" cy="160" r="88"/>
            <g class="glass">
              <circle cx="160" cy="160" r="91" fill="#e3e8ec" filter="url(#${id}-drop)"/>
              <circle cx="160" cy="160" r="86" fill="url(#${id}-glass)" stroke="url(#${id}-rim)" stroke-width="1.2"/>
              <circle cx="160" cy="160" r="80" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="5" filter="url(#${id}-soft)"/>
              <path d="M96 128a70 70 0 0 1 128 0a120 60 0 0 0 -128 0z" fill="url(#${id}-spec)"/>
            </g>
            <g class="needle-shadow" filter="url(#${id}-soft)"><line x1="160" y1="66" x2="160" y2="22" stroke="rgba(20,35,50,.3)" stroke-width="2"/></g>
            <g class="ghost"><line x1="160" y1="66" x2="160" y2="26"/></g>
            <g class="needle-glow" filter="url(#${id}-blur)" opacity=".55"><line x1="160" y1="66" x2="160" y2="22" stroke="#e5163f" stroke-width="3"/></g>
            <g class="needle"><line x1="160" y1="66" x2="160" y2="22"/><circle cx="160" cy="66" r="2.3" fill="#e5163f"/></g>
            <circle class="ref" cx="160" cy="160" r=".5" fill="none"/><circle class="ref" cx="260" cy="160" r=".5" fill="none"/><circle class="ref" cx="160" cy="260" r=".5" fill="none"/>
          </svg>
          <div class="readout">
            <span class="meta">Bid · per stem</span>
            <label class="amount"><span class="cur" aria-hidden="true">$</span><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="${d.dataset.label}, dollars"></label>
            <span class="meta hint"><span class="h-idle">Step $${dollars(this.unit)}</span><span class="h-edit">Edit bid</span><span class="h-type">↵ Set · Esc</span></span>
          </div>
        </div>
        <div class="data">
          <div class="box target-box"><b>Target</b><span class="target">—</span></div>
          <div class="box"><b>Δ</b><span class="delta">+0.00</span></div>
          <div class="box"><b>State</b><span><i class="led"></i><span class="state">IDLE</span></span></div>
        </div>`;
      const svg = this.svg = d.querySelector(".dial");
      this.track = svg.querySelector(".track");
      this.shine = svg.querySelector(".shine");
      this.rotating = [".needle", ".needle-glow"].map((s) => svg.querySelector(s));
      this.shadow = svg.querySelector(".needle-shadow");
      this.ghost = svg.querySelector(".ghost");
      this.pulse = svg.querySelector(".pulse");
      this.refs = [...svg.querySelectorAll(".ref")];
      this.amount = d.querySelector(".amount");
      this.input = d.querySelector(".amount input");
      this.targetBox = d.querySelector(".target-box");
      this.targetEl = d.querySelector(".target");
      this.deltaEl = d.querySelector(".delta");
      this.stateEl = d.querySelector(".state");
      this.spark = d.querySelector(".spark polyline");
      this.sparkDot = d.querySelector(".spark circle");
      const tg = svg.querySelector(".ticks"), lg = svg.querySelector(".labels");
      this.tickEls = []; this.labelEls = [];
      for (let i = 0; i < this.ticks; i++) {
        const major = i % this.major === 0, a = angleOf(i / (this.ticks - 1));
        const [x0, y0] = pt(major ? 112 : 120, a), [x1, y1] = pt(132, a);
        const l = document.createElementNS(NS, "line");
        l.setAttribute("class", "tick");
        l.setAttribute("x1", x0.toFixed(2)); l.setAttribute("y1", y0.toFixed(2)); l.setAttribute("x2", x1.toFixed(2)); l.setAttribute("y2", y1.toFixed(2));
        l.setAttribute("stroke-width", major ? 2 : 1.1);
        tg.append(l); this.tickEls.push({ el: l, shown: -1, color: "" });
        if (major) {
          const [lx, ly] = pt(100, a);
          const t = document.createElementNS(NS, "text");
          t.setAttribute("class", "lbl"); t.setAttribute("x", lx.toFixed(1)); t.setAttribute("y", ly.toFixed(1));
          t.textContent = dollars(i / (this.ticks - 1) * MAX);
          lg.append(t); this.labelEls.push({ el: t, t: i / (this.ticks - 1) });
        }
      }
    }
    setState(s) {
      if (this.state === s) return;
      this.state = s;
      this.dev.dataset.state = s;
      this.stateEl.textContent = { idle: "IDLE", hover: "HOVER", press: "PRESS", drag: "DRAG", input: "INPUT" }[s];
      if (s !== "hover" && s !== "input") this.preview = null;
      this.report();
    }
    setValue(v) {
      v = this.quantize(v);
      if (v === this.value) return;
      const prevText = dollars(this.value);
      this.delta = v - this.value;
      this.value = v;
      this.needle.t = v / MAX;
      if (reduce.matches) { this.needle.x = this.needle.t; this.needle.v = 0; }
      // While dragging, changed digits flicker for 70ms before locking in.
      if (this.state === "drag" && !reduce.matches) {
        const next = dollars(v), until = performance.now() + 70;
        this.scramble = [...next].map((ch, i) => (ch !== prevText[i] && /\d/.test(ch) ? until : 0));
      }

    }
    save() { if (this.dev.dataset.store) store.set(this.dev.dataset.store, this.value); }
    report() {
      this.svg.setAttribute("aria-valuenow", this.value);
      this.svg.setAttribute("aria-valuetext", money(this.value) + " per stem");
      const p = this.preview, d = p != null ? p - this.value : this.delta;
      this.targetEl.textContent = p != null ? money(p) : "—";
      this.targetBox.toggleAttribute("data-live", p != null);
      this.deltaEl.textContent = (d >= 0 ? "+" : "−") + (Math.abs(d) / 100).toFixed(2);
      this.deltaEl.className = "delta " + (d > 0 ? "up" : d < 0 ? "down" : "");
    }
    // Screen point → dial coordinates from three reference points, so the 3D tilt is accounted for.
    dialPoint(e) {
      const [c, a, b] = this.refs.map((r) => { const q = r.getBoundingClientRect(); return [q.left + q.width / 2, q.top + q.height / 2]; });
      const ax = (a[0] - c[0]) / 100, ay = (a[1] - c[1]) / 100, bx = (b[0] - c[0]) / 100, by = (b[1] - c[1]) / 100;
      const px = e.clientX - c[0], py = e.clientY - c[1], det = ax * by - ay * bx;
      return { u: (px * by - py * bx) / det, v: (ax * py - ay * px) / det };
    }
    valueAt(e) {
      const { u, v } = this.dialPoint(e);
      const deg = Math.atan2(u, -v) * 180 / Math.PI;
      let t = (deg - START) / SWEEP;
      if (deg > 150 || deg < -150) t = this.needle.t < .5 ? 0 : 1; // the gap keeps the nearer end
      return { value: clamp(t, 0, 1) * MAX, r: Math.hypot(u, v) };
    }
    bind() {
      const svg = this.svg;
      svg.addEventListener("pointermove", (e) => {
        if (this.state === "input") return;
        if (this.state === "press" && Math.hypot(e.clientX - this.downX, e.clientY - this.downY) > 3) this.setState("drag");
        if (this.state === "drag") { this.setValue(this.valueAt(e).value); return; }
        if (this.state === "press" || e.pointerType !== "mouse") return;
        this.setState("hover");
        this.preview = this.quantize(this.valueAt(e).value);
        this.report();
      });
      svg.addEventListener("pointerleave", () => { if (this.state === "hover") this.setState("idle"); });
      svg.addEventListener("pointerdown", (e) => {
        if (e.button) return;
        if (document.activeElement === this.input) this.input.blur();
        try { svg.setPointerCapture(e.pointerId); } catch {}
        this.downX = e.clientX; this.downY = e.clientY;
        this.setState("press");
        const { value, r } = this.valueAt(e);
        if (r > 30) this.setValue(value);
        if (!reduce.matches) { this.pulse.classList.remove("go"); void this.pulse.getBBox(); this.pulse.classList.add("go"); }
      });
      const end = (e) => {
        if (this.state !== "press" && this.state !== "drag") return;
        const r = svg.getBoundingClientRect();
        const inside = e.pointerType === "mouse" && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        this.setState(inside ? "hover" : "idle");
        this.save();
      };
      svg.addEventListener("pointerup", end);
      svg.addEventListener("pointercancel", end);
      svg.addEventListener("keydown", (e) => {
        const step = this.stepped ? 25 : (e.shiftKey ? 10 : 1);
        const map = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: 25, PageDown: -25 };
        let next;
        if (e.key in map) next = this.value + map[e.key];
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = MAX;
        else return;
        e.preventDefault();
        this.setValue(next);
        this.save();
      });

      // Typed bid: digits and one point, previewed by the ghost needle; Enter or blur sets it, Esc cancels.
      const input = this.input;
      const nudge = () => { this.amount.removeAttribute("data-error"); void this.amount.offsetWidth; this.amount.dataset.error = ""; };
      const parse = () => Math.round(parseFloat(input.value) * 100);
      input.addEventListener("focus", () => { this.setState("input"); this.typed = false; requestAnimationFrame(() => input.select()); });
      input.addEventListener("input", () => {
        let raw = input.value.replace(/[^\d.]/g, "");
        const dot = raw.indexOf(".");
        if (dot >= 0) raw = raw.slice(0, dot + 1) + raw.slice(dot + 1).replace(/\./g, "").slice(0, 2);
        raw = raw.slice(0, 5);
        if (raw !== input.value) nudge();
        input.value = raw; this.fit();
        this.typed = true;
        const c = parse();
        this.preview = Number.isFinite(c) ? this.quantize(c) : null;
        this.report();
      });
      const commit = () => {
        if (this.typed) {
          const c = parse();
          if (!Number.isFinite(c) || c > MAX || (this.stepped && c % 25)) nudge();
          if (Number.isFinite(c)) { this.setValue(c); this.save(); }
        }
        this.typed = false; this.preview = null;
        this.showValue(); this.report();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { commit(); input.select(); }
        else if (e.key === "Escape") { this.typed = false; this.preview = null; this.showValue(); this.report(); input.blur(); }
        else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          this.typed = false;
          this.setValue(this.value + (e.key === "ArrowUp" ? 1 : -1) * (this.stepped ? 25 : e.shiftKey ? 10 : 1));
          this.save(); this.showValue(); input.select();
        }
      });
      input.addEventListener("blur", () => { commit(); this.setState("idle"); });
    }
    fit() { this.input.style.width = Math.max(1, this.input.value.length) + "ch"; }
    showValue(text = dollars(this.value)) {
      if (this.typed || text === this.shownText) return;
      this.input.value = text; this.shownText = text; this.fit();
    }
    tick(dt, now) {
      const n = this.needle;
      if (reduce.matches) { n.x = n.t; n.v = 0; }
      // Stepped glides into each stop with no overshoot (critically damped); continuous follows closely.
      else if (this.stepped) spring(n, 260, 34, dt);
      else spring(n, 700, 50, dt);
      const t = n.x, a = angleOf(t);
      for (const g of this.rotating) g.setAttribute("transform", `rotate(${a.toFixed(2)} 160 160)`);
      this.shadow.setAttribute("transform", `translate(1.5 2.5) rotate(${a.toFixed(2)} 160 160)`);
      if (this.preview != null) this.ghost.setAttribute("transform", `rotate(${angleOf(this.preview / MAX).toFixed(2)} 160 160)`);
      const d = arc(140, START, a);
      this.track.setAttribute("d", d); this.shine.setAttribute("d", d);

      // Lit ticks up to the needle; ticks it sweeps past flash (bright rising, crimson falling) and fade like phosphor.
      const decay = Math.exp(-dt * 2.6);
      for (let i = 0; i < this.ticks; i++) {
        const tt = i / (this.ticks - 1);
        if ((this.lastT - tt) * (t - tt) < 0) { this.boost[i] = 1; this.boostUp[i] = t > this.lastT ? 1 : 0; }
        this.boost[i] *= decay;
        const lit = tt <= t + 1e-4, b = this.boost[i];
        const color = lit ? (b > .3 ? "#19e08f" : "#00b56f") : (b > .03 ? (this.boostUp[i] ? "#19e08f" : "#e5163f") : "#c4ccd3");
        const op = lit ? .85 + .15 * b : b > .03 ? .3 + .7 * b : 1;
        const s = this.tickEls[i];
        if (s.color !== color || Math.abs(s.shown - op) > .02) {
          s.color = color; s.shown = op;
          s.el.setAttribute("stroke", color); s.el.setAttribute("opacity", op.toFixed(2));
        }
      }
      this.lastT = t;
      for (const l of this.labelEls) l.el.toggleAttribute("data-near", Math.abs(l.t - t) < .045);

      let text = dollars(this.value);
      if (this.scramble.length) {
        let live = false;
        text = [...text].map((ch, i) => { if (this.scramble[i] > now) { live = true; return String(Math.floor(Math.random() * 10)); } return ch; }).join("");
        if (!live) this.scramble = [];
      }
      if (document.activeElement !== this.input) this.showValue(text);

      // Trend sparkline: the last four seconds of the bid, scrolling.
      this.sampleClock += dt;
      if (this.sampleClock > .1) {
        this.sampleClock = 0;
        this.history.push(this.value); this.history.shift();
        this.spark.setAttribute("points", this.history.map((v, i) => `${i} ${(11 - v / MAX * 10).toFixed(2)}`).join(" "));
        this.sparkDot.setAttribute("cx", 39); this.sparkDot.setAttribute("cy", (11 - this.value / MAX * 10).toFixed(2));
      }
    }
  }

  const clocks = [...document.querySelectorAll(".device")].map((d) => new AuctionClock(d));
  let last = performance.now();
  requestAnimationFrame(function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const c of clocks) c.tick(dt, now);
    requestAnimationFrame(frame);
  });
})();
</script>
